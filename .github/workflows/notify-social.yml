name: Notify Social Interactions

on:
  schedule:
    - cron: "*/5 * * * *"   # Every 5 minutes (public repo — Actions minutes are unlimited).
                            # NOTE: GitHub's scheduler is best-effort and drops ticks under
                            # load; frequent runs give more catch-up chances. For guaranteed
                            # timing, drive workflow_dispatch from an external cron instead.
  workflow_dispatch:           # Allow manual trigger from GitHub UI

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Drain social notification queue
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node notify-social.js

