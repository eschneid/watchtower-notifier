name: Notify Social Interactions

on:
  schedule:
    - cron: "*/15 * * * *"   # Every 15 minutes (public repo — Actions minutes are unlimited)
  workflow_dispatch:           # Allow manual trigger from GitHub UI

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Drain social notification queue
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node notify-social.js
