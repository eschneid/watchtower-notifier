name: Notify Social Interactions

# Triggered every ~5 min by an external cron (cron-job.org) hitting the
# workflow_dispatch API — GitHub's built-in `schedule` was unreliable (dropped
# most ticks), and running both risked double-sending (overlapping drains before
# queue items are deleted). cron-job.org is now the single, reliable trigger.
on:
  workflow_dispatch:           # Fired by cron-job.org (and manual runs from the UI)

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Drain social notification queue
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node notify-social.js
